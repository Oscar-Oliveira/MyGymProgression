<!doctype html>
<html lang="pt" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f2f3f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#08090f" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="GymProg" />
    <title>MyGymProgression</title>
    <style>
      /* Splash: visible before the app loads; src/main.tsx fades it out. */
      #splash { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.6rem; background: #08090f; color: #f3f4fa; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; pointer-events: none; transition: opacity 0.35s ease; }
      #splash strong { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em; margin-top: 0.4rem; }
      #splash span { font-size: 0.85rem; color: #9298ad; font-variant-numeric: tabular-nums; }
      #splash.hide { opacity: 0; }
      @media (prefers-reduced-motion: reduce) { #splash { transition: none; } }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <img src="/icon.svg" width="88" height="88" alt="" />
      <strong>MyGymProgression</strong>
      <span>v%APP_VERSION%</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
