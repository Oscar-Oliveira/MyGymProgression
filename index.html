<!doctype html>
<html lang="pt" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f2f3f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#08090f" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="GymProg" />
    <title>MyGymProgression</title>
    <style>
      /* Splash (V2-D25): logo, name and gym while the app loads; src/main.tsx fades it out by itself.
         Always dark, the background_color of the manifest (vite.config.ts): the Android splash and this one look like one. */
      #splash { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.35rem; background: #0a0a0b; color: #f5f5f7; font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; pointer-events: none; transition: opacity 0.3s ease; }
      #splash img { width: 76px; height: 76px; border-radius: 18px; margin-bottom: 0.65rem; animation: splash-in 0.45s ease-out both; }
      #splash strong { font-size: 1.35rem; font-weight: 600; letter-spacing: -0.01em; animation: splash-in 0.45s ease-out 0.08s both; }
      #splash em { font-style: normal; font-size: 0.95rem; font-weight: 500; opacity: 0.6; max-width: 90vw; text-align: center; overflow-wrap: anywhere; }
      #splash span { position: absolute; bottom: calc(1.75rem + env(safe-area-inset-bottom)); font-size: 0.78rem; opacity: 0.45; font-variant-numeric: tabular-nums; }
      #splash.hide { opacity: 0; }
      @keyframes splash-in { from { opacity: 0; transform: translateY(6px); } }
      @media (prefers-reduced-motion: reduce) { #splash, #splash img, #splash strong { transition: none; animation: none; } }
    </style>
  </head>
  <body>
    <div id="splash">
      <img src="/icon.svg" width="88" height="88" alt="" aria-hidden="true" />
      <strong>MyGymProgression</strong>
      <em id="splash-gym" hidden></em>
      <span>v%APP_VERSION%</span>
      <script>
        // The theme and the gym name (D80) of the last start, so they show before the app loads. App keeps them up to date.
        try {
          var theme = localStorage.getItem('v2:theme');
          if (theme) document.documentElement.dataset.theme = theme;
          var gym = localStorage.getItem('gymName');
          var el = document.getElementById('splash-gym');
          if (gym) (el.textContent = '@ ' + gym), (el.hidden = false);
        } catch (e) {}
      </script>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
